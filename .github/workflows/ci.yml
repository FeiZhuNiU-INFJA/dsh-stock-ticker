name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check bundle entries
        run: |
          node --check lib/index.js
          node --check lib/client.js

      - name: Validate package manifest
        run: |
          node -e "const p=require('./package.json'); if (!p.dsh?.bundle?.patch) throw new Error('missing dsh.bundle.patch'); if (p.dsh?.client?.platform !== 'web') throw new Error('missing dsh.client.platform=web'); console.log('manifest ok:', p.dsh.bundle.patch)"
